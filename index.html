<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marina — Software Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dusty-pink: #c8a9a0;
      --dusty-pink-deep: #b08f86;
      --light-pink: #ead9d4;
      --charcoal: #3a3330;
      --charcoal-soft: #5b504b;
      --window-bg: #f3e9e6;
      --window-chrome: #d8c2bb;
      --accent: #a8645b;
      --accent-soft: #c98c83;
      --shadow: rgba(58,51,48,0.35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--charcoal);
      overflow: hidden;
      background: var(--dusty-pink);
    }

    /* ── DESKTOP BACKGROUND ── */
    .desktop {
      position: fixed; inset: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(200,169,160,0.55), rgba(176,143,134,0.75)),
        url('https://res.cloudinary.com/dp8nskt0z/image/upload/q_auto/f_auto/v1778367378/about_pic_zhsunp.png');
      background-size: cover;
      background-position: center 20%;
    }
    .desktop::after {
      content: ""; position: absolute; inset: 0;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      background: rgba(200,169,160,0.25);
      pointer-events: none;
    }

    /* ── TOP PILL NAV ── */
    .topbar {
      position: fixed; top: 0.9rem; left: 0; right: 0; z-index: 60;
      display: flex; justify-content: center; pointer-events: none;
    }
    .pill-nav {
      pointer-events: auto;
      display: flex; gap: 0.35rem; align-items: center;
      background: rgba(243,233,230,0.7);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(168,100,91,0.25);
      border-radius: 9999px;
      padding: 0.3rem 0.45rem;
      box-shadow: 0 6px 18px var(--shadow);
    }
    .pill-nav button {
      font: inherit; font-size: 0.78rem; font-weight: 500;
      color: var(--charcoal-soft);
      background: transparent; border: 1px solid transparent;
      padding: 0.3rem 0.8rem; border-radius: 9999px; cursor: pointer;
      transition: all 0.15s; text-decoration: underline; text-underline-offset: 2px;
      text-decoration-color: rgba(91,80,75,0.4);
    }
    .pill-nav button:hover { background: rgba(168,100,91,0.12); color: var(--accent); }
    .pill-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .pill-nav button.active { background: var(--accent); color: #fff; text-decoration-color: transparent; }

    /* ── DESKTOP ICONS ── */
    .icon-layer { position: absolute; inset: 0; z-index: 10; }
    .desktop-icon {
      position: absolute;
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
      width: 104px; padding: 0.4rem 0.25rem;
      background: transparent; border: 1px solid transparent; border-radius: 0.5rem;
      cursor: pointer; font: inherit; color: var(--charcoal);
      transition: background 0.12s, border-color 0.12s;
    }
    .desktop-icon:hover { background: rgba(243,233,230,0.35); }
    .desktop-icon:focus-visible { outline: none; background: rgba(168,100,91,0.2); border-color: rgba(168,100,91,0.5); }
    .desktop-icon .glyph {
      width: 54px; height: 54px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.9rem; line-height: 1;
      box-shadow: 0 4px 10px var(--shadow);
      overflow: hidden;
    }
    .desktop-icon .glyph.photo { padding: 3px; background: #fff; }
    .desktop-icon .glyph.photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; display: block; }
    .desktop-icon .label {
      font-size: 0.72rem; font-weight: 500; text-align: center; line-height: 1.25;
      color: #fff; text-shadow: 0 1px 3px rgba(58,51,48,0.8);
      background: rgba(58,51,48,0.18); padding: 0.1rem 0.4rem; border-radius: 4px;
      max-width: 100%; overflow-wrap: break-word; word-break: break-word;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    }
    .glyph-about   { background: linear-gradient(135deg,#e9c6bf,#c98c83); }
    .glyph-contact { background: linear-gradient(135deg,#cf9d95,#a8645b); }
    .glyph-folder  { background: linear-gradient(160deg,#7fb3e0,#4a82c4); color:#fff; }
    .glyph-exp     { background: linear-gradient(135deg,#d8c2bb,#b08f86); }
    .glyph-edu     { background: linear-gradient(135deg,#e6d2b8,#c9a76f); }
    .glyph-trophy  { background: linear-gradient(135deg,#f0d9a0,#cba14a); }
    .glyph-browser { background: linear-gradient(135deg,#cfe5f5,#7fb3e0); }

    /* ── WINDOWS ── */
    .window {
      position: absolute; z-index: 100;
      display: none; flex-direction: column;
      width: min(680px, 92vw); max-height: 82vh;
      background: var(--window-bg);
      border: 1px solid rgba(58,51,48,0.25);
      border-radius: 10px;
      box-shadow: 0 24px 60px rgba(58,51,48,0.45);
      overflow: hidden;
    }
    .window.open { display: flex; }
    .window-chrome {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.7rem;
      background: linear-gradient(180deg, var(--window-chrome), #cbb3ac);
      border-bottom: 1px solid rgba(58,51,48,0.2);
      cursor: grab; user-select: none;
    }
    .window-chrome.dragging { cursor: grabbing; }
    /* traffic-light controls (close / minimize / maximize) */
    .traffic { display: flex; gap: 0.5rem; }
    .traffic button {
      width: 14px; height: 14px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; padding: 0; cursor: pointer;
      border: 1px solid rgba(58,51,48,0.22); line-height: 1;
      font-size: 0.6rem; color: transparent; transition: color 0.12s, filter 0.12s;
    }
    .traffic .tl-close { background: #e0726b; }
    .traffic .tl-min   { background: #e6b450; }
    .traffic .tl-max   { background: #8bb87a; }
    .traffic button:hover { filter: brightness(0.92); color: rgba(58,51,48,0.75); }
    .traffic button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; color: rgba(58,51,48,0.75); }
    .window-title {
      flex: 1; text-align: center; font-size: 0.82rem; font-weight: 600;
      color: var(--charcoal); display: flex; align-items: center; justify-content: center; gap: 0.4rem;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    /* spacer keeps the title visually centered opposite the traffic lights */
    .chrome-spacer { width: 52px; flex-shrink: 0; }

    /* maximized window fills the workspace */
    .window.maximized {
      top: 1rem !important; left: 1rem !important; right: 1rem;
      width: auto !important; max-width: none;
      height: calc(100vh - 6rem); max-height: none;
      transform: none !important;
    }
    .window-body {
      padding: 1.5rem; overflow-y: auto; color: var(--charcoal-soft);
      line-height: 1.65; font-size: 0.92rem;
    }
    .window-body h2 {
      font-family: 'DM Serif Display', serif; font-weight: 400;
      color: var(--charcoal); font-size: 1.8rem; margin-bottom: 0.25rem;
    }
    .window-body h3 { color: var(--charcoal); font-size: 1.05rem; margin: 1.25rem 0 0.3rem; }
    .window-body p { margin-bottom: 0.7rem; }
    .window-body strong { color: var(--accent); font-weight: 600; }
    .subtitle { color: var(--dusty-pink-deep); font-size: 0.82rem; margin-bottom: 1rem; font-style: italic; }

    .about-grid { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
    .about-portrait {
      width: 150px; height: 180px; border-radius: 10px; object-fit: cover;
      box-shadow: 0 6px 16px var(--shadow); flex-shrink: 0;
      border: 4px solid #fff; transform: rotate(-2deg);
    }
    .about-copy { flex: 1; min-width: 220px; }
    .meta-row { display: inline-flex; align-items: center; gap: 0.35rem; color: var(--dusty-pink-deep); font-size: 0.85rem; margin-bottom: 0.75rem; }

    /* contact links */
    .contact-links { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 0.5rem; }
    .contact-link {
      display: flex; align-items: center; gap: 0.7rem; text-decoration: none;
      padding: 0.7rem 0.9rem; border-radius: 8px; color: var(--charcoal);
      background: rgba(255,255,255,0.55); border: 1px solid rgba(58,51,48,0.12);
      transition: all 0.15s; font-weight: 500;
    }
    .contact-link:hover { background: #fff; border-color: var(--accent); transform: translateX(3px); }
    .contact-link svg { width: 22px; height: 22px; flex-shrink: 0; }
    .contact-link .sub { display: block; font-size: 0.75rem; font-weight: 400; color: var(--dusty-pink-deep); }

    /* timeline inside windows */
    .tl { position: relative; border-left: 2px solid var(--dusty-pink); margin-left: 0.5rem; padding-left: 1rem; }
    .tl-item { margin-bottom: 1.4rem; position: relative; }
    .tl-item::before {
      content: ""; position: absolute; left: -1.4rem; top: 0.3rem;
      width: 0.7rem; height: 0.7rem; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--window-bg);
    }
    .tl-date { font-size: 0.75rem; color: var(--dusty-pink-deep); font-weight: 600; }
    .tl-title { color: var(--charcoal); font-size: 1rem; font-weight: 600; margin: 0.15rem 0; }
    .tl-sub { font-size: 0.82rem; color: var(--charcoal-soft); margin-bottom: 0.4rem; }
    .tl-body ul { padding-left: 1.1rem; margin-top: 0.3rem; }
    .tl-body li { margin-bottom: 0.25rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
    .tag {
      font-size: 0.68rem; font-family: monospace; padding: 0.12rem 0.5rem; border-radius: 9999px;
      background: rgba(168,100,91,0.1); color: var(--accent); border: 1px solid rgba(168,100,91,0.25);
    }

    /* projects */
    .proj-grid { display: grid; grid-template-columns: 1fr; gap: 1.1rem; }
    @media (min-width: 540px) { .proj-grid { grid-template-columns: 1fr 1fr; } }
    .proj-card {
      background: rgba(255,255,255,0.6); border: 1px solid rgba(58,51,48,0.12);
      border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    }
    .proj-thumb { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: var(--dusty-pink); cursor: zoom-in; }
    .proj-thumb.ph { display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
    .proj-info { padding: 0.8rem; }
    .proj-info h3 { margin: 0 0 0.3rem; font-size: 1rem; }
    .proj-info p { font-size: 0.8rem; margin-bottom: 0.4rem; line-height: 1.5; }
    .proj-private { font-size: 0.72rem; color: var(--dusty-pink-deep); font-family: monospace; }

    /* ── FOLDER EXPLORER (Finder-style: icon grid + right preview) ── */
    .window.is-folder .window-body { padding: 0; }
    .explorer { display: flex; min-height: 320px; }
    .explorer-main {
      flex: 1 1 auto; min-width: 0;
      padding: 1rem; display: grid; align-content: start; gap: 0.6rem;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      background: rgba(255,255,255,0.35);
      border-right: 1px solid rgba(58,51,48,0.15);
    }
    .fitem {
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      padding: 0.55rem 0.3rem; border-radius: 8px; cursor: pointer;
      background: transparent; border: 1px solid transparent; font: inherit;
      color: var(--charcoal); text-align: center; transition: background 0.12s, border-color 0.12s;
    }
    .fitem:hover { background: rgba(168,100,91,0.1); }
    .fitem:focus-visible { outline: none; background: rgba(168,100,91,0.18); border-color: rgba(168,100,91,0.5); }
    .fitem[aria-selected="true"] { background: rgba(168,100,91,0.2); border-color: rgba(168,100,91,0.45); }
    .fitem .fglyph {
      width: 48px; height: 48px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.7rem; line-height: 1; box-shadow: 0 3px 8px var(--shadow); overflow: hidden;
    }
    .fitem .fglyph.photo { padding: 3px; background: #fff; }
    .fitem .fglyph.photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
    .fitem .flabel {
      font-size: 0.72rem; font-weight: 500; line-height: 1.2;
      overflow-wrap: anywhere; word-break: break-word;
    }
    .explorer-aside {
      flex: 0 0 248px; width: 248px; padding: 1.1rem;
      overflow-y: auto; background: rgba(243,233,230,0.6);
    }
    .preview-thumb {
      width: 100%; aspect-ratio: 16/11; object-fit: cover; border-radius: 9px;
      background: var(--dusty-pink); display: block; margin-bottom: 0.7rem;
      border: 3px solid #fff; box-shadow: 0 4px 12px var(--shadow);
    }
    .preview-thumb.ph { display: flex; align-items: center; justify-content: center; font-size: 2.6rem; }
    .explorer-aside h3 { font-family: 'DM Serif Display', serif; font-weight: 400; color: var(--charcoal); font-size: 1.3rem; margin-bottom: 0.3rem; }
    .explorer-aside p { font-size: 0.82rem; line-height: 1.55; margin-bottom: 0.55rem; color: var(--charcoal-soft); }
    .preview-hint { font-size: 0.7rem; color: var(--dusty-pink-deep); font-style: italic; margin-top: 0.4rem; }

    /* logo rows in folder preview (work / education / achievements) */
    .logo-rows { list-style: none; margin: 0.5rem 0 0.2rem; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
    .logo-row { display: flex; align-items: center; gap: 0.6rem;
      background: rgba(255,255,255,0.6); border: 1px solid rgba(58,51,48,0.12);
      border-radius: 9px; padding: 0.45rem 0.55rem; }
    .logo-badge {
      flex: 0 0 auto; width: 38px; height: 38px; border-radius: 9px; overflow: hidden;
      background: #fff; border: 1px solid rgba(58,51,48,0.12);
      box-shadow: 0 2px 6px var(--shadow);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-badge .logo-img { width: 100%; height: 100%; object-fit: contain; padding: 4px; display: block; }
    .logo-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
      color: #fff; background: linear-gradient(135deg, var(--accent-soft), var(--accent));
    }
    .logo-meta { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
    .logo-title { font-size: 0.78rem; font-weight: 600; color: var(--charcoal);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logo-org { font-size: 0.72rem; color: var(--charcoal-soft);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logo-date { font-size: 0.68rem; font-weight: 600; color: var(--dusty-pink-deep); }
    @media (max-width: 620px) {
      .explorer { flex-direction: column; }
      .explorer-main { border-right: none; border-bottom: 1px solid rgba(58,51,48,0.15); }
      .explorer-aside { flex-basis: auto; width: 100%; }
    }

    /* ── TASKBAR for minimized windows ── */
    .taskbar {
      position: fixed; bottom: 0.9rem; left: 0; right: 0; z-index: 65;
      display: flex; justify-content: center; gap: 0.4rem; pointer-events: none; flex-wrap: wrap;
    }
    .taskbar .task-btn {
      pointer-events: auto; font: inherit; font-size: 0.74rem; font-weight: 500;
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: rgba(243,233,230,0.85); color: var(--charcoal);
      border: 1px solid rgba(168,100,91,0.3); border-radius: 9999px;
      padding: 0.3rem 0.8rem; cursor: pointer; box-shadow: 0 4px 12px var(--shadow);
      backdrop-filter: blur(8px);
    }
    .taskbar .task-btn:hover { background: #fff; border-color: var(--accent); }
    .taskbar .task-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* lightbox */
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 999;
      background: rgba(58,51,48,0.85); align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; border: 5px solid #fff; }
    .lightbox-close {
      position: absolute; top: 1.2rem; right: 1.2rem; width: 2.4rem; height: 2.4rem;
      border-radius: 50%; border: none; background: rgba(255,255,255,0.85); color: var(--charcoal);
      font-size: 1.4rem; cursor: pointer;
    }

    /* taskbar / hint */
    .hint {
      position: fixed; bottom: 0.9rem; left: 0; right: 0; z-index: 60;
      display: flex; justify-content: center; pointer-events: none;
    }
    .hint span {
      background: rgba(58,51,48,0.55); color: var(--light-pink);
      font-size: 0.72rem; padding: 0.3rem 0.85rem; border-radius: 9999px;
      backdrop-filter: blur(6px);
    }

    @media (max-width: 560px) {
      .desktop-icon { width: 92px; }
      .window-body { padding: 1.1rem; }
    }
  </style>
</head>
<body>

<div class="desktop" id="desktop" tabindex="-1"></div>

<!-- TOP PILL NAV -->
<div class="topbar">
  <nav class="pill-nav" aria-label="Primary">
    <button type="button" data-open="reset" class="active">home</button>
    <button type="button" data-open="about">about</button>
    <button type="button" data-open="contact">contact</button>
  </nav>
</div>

<!-- DESKTOP ICONS -->
<div class="icon-layer" id="iconLayer">

  <button class="desktop-icon" type="button" data-open="about" style="top:22%;left:8%;" aria-label="Open About folder" data-testid="icon-about">
    <span class="glyph glyph-folder" aria-hidden="true">📁</span>
    <span class="label">About</span>
  </button>

  <button class="desktop-icon" type="button" data-open="contact" style="top:48%;left:7%;" aria-label="Open Contact window" data-testid="icon-contact">
    <span class="glyph glyph-contact" aria-hidden="true">✉️</span>
    <span class="label">Contact</span>
  </button>

  <button class="desktop-icon" type="button" data-open="projects" style="top:74%;left:70%;" aria-label="Open Projects folder" data-testid="icon-projects">
    <span class="glyph glyph-folder" aria-hidden="true">📁</span>
    <span class="label">Projects</span>
  </button>

  <a class="desktop-icon" href="https://github.com/marinucs" target="_blank" rel="noopener noreferrer" style="top:24%;left:60%;text-decoration:none;" aria-label="Open GitHub profile in a new tab" data-testid="icon-explore">
    <span class="glyph glyph-browser" aria-hidden="true">🌐</span>
    <span class="label">Explore</span>
  </a>

</div>

<!-- ════════ WINDOWS ════════ -->

<!-- ABOUT FOLDER -->
<section class="window is-folder" id="win-about" role="dialog" aria-modal="false" aria-labelledby="win-about-title" tabindex="-1" data-testid="window-about" style="top:14%;left:50%;transform:translateX(-50%);width:min(640px,94vw);">
  <header class="window-chrome">
    <span class="traffic">
      <button type="button" class="tl-close" data-ctl="close" aria-label="Close About folder" data-testid="about-ctl-close">&times;</button>
      <button type="button" class="tl-min" data-ctl="min" aria-label="Minimize About folder" data-testid="about-ctl-min">&minus;</button>
      <button type="button" class="tl-max" data-ctl="max" aria-label="Maximize About folder" data-testid="about-ctl-max">+</button>
    </span>
    <span class="window-title" id="win-about-title">📁 About</span>
    <span class="chrome-spacer" aria-hidden="true"></span>
  </header>
  <div class="window-body">
    <div class="explorer">
      <div class="explorer-main" role="listbox" aria-label="About folder contents" data-folder="about" data-testid="about-grid"></div>
      <aside class="explorer-aside" data-preview="about" aria-live="polite" data-testid="about-preview"></aside>
    </div>
  </div>
</section>

<!-- ABOUT CONTENT POPUP (shared, replaced on open) -->
<section class="window" id="win-about-content" role="dialog" aria-modal="false" aria-labelledby="win-about-content-title" tabindex="-1" data-testid="window-about-content" style="top:20%;left:auto;right:4%;">
  <header class="window-chrome">
    <span class="traffic">
      <button type="button" class="tl-close" data-ctl="close" aria-label="Close window" data-testid="aboutcontent-ctl-close">&times;</button>
      <button type="button" class="tl-min" data-ctl="min" aria-label="Minimize window" data-testid="aboutcontent-ctl-min">&minus;</button>
      <button type="button" class="tl-max" data-ctl="max" aria-label="Maximize window" data-testid="aboutcontent-ctl-max">+</button>
    </span>
    <span class="window-title" id="win-about-content-title">About</span>
    <span class="chrome-spacer" aria-hidden="true"></span>
  </header>
  <div class="window-body" data-testid="about-content-body"></div>
</section>

<!-- CONTACT -->
<section class="window" id="win-contact" role="dialog" aria-modal="false" aria-labelledby="win-contact-title" tabindex="-1" data-testid="window-contact" style="top:20%;left:50%;transform:translateX(-50%);width:min(440px,92vw);">
  <header class="window-chrome">
    <span class="traffic">
      <button type="button" class="tl-close" data-ctl="close" aria-label="Close Contact window" data-testid="contact-ctl-close">&times;</button>
      <button type="button" class="tl-min" data-ctl="min" aria-label="Minimize Contact window" data-testid="contact-ctl-min">&minus;</button>
      <button type="button" class="tl-max" data-ctl="max" aria-label="Maximize Contact window" data-testid="contact-ctl-max">+</button>
    </span>
    <span class="window-title" id="win-contact-title">✉️ Contact</span>
    <span class="chrome-spacer" aria-hidden="true"></span>
  </header>
  <div class="window-body">
    <h2>Get in touch</h2>
    <p class="subtitle">Did you like what you saw? I'd love to hear from you.</p>

  let zCounter = 100;
  const openWindows = []; // visible (non-minimized) windows, front-most last

  const $ = (sel, root) => (root || document).querySelector(sel);
  const taskbar = document.getElementById('taskbar');
  const lightbox = document.getElementById('lightbox');

  function focusWindow(win) { zCounter += 1; win.style.zIndex = zCounter; }

  function windowTitle(win) {
    const t = $('.window-title', win);
    return t ? t.textContent.trim() : 'Window';
  }

  function openWindow(win) {
    if (!win) return;
    if (win.dataset.minimized === 'true') { restoreWindow(win); return; }
    if (!win.classList.contains('open')) {
      win.classList.add('open');
      openWindows.push(win);
    }
    focusWindow(win);
    win.focus();
    syncNav();
  }

  function closeWindow(win) {
    if (!win) return;
    win.classList.remove('open', 'maximized');
    win.dataset.minimized = 'false';
    delById(openWindows, win);
    delById(minimized, win);
    renderTaskbar();
    syncNav();
    focusDesktopOrTop();
  }

  function minimizeWindow(win) {
    if (!win || !win.classList.contains('open')) return;
    win.classList.remove('open');
    win.dataset.minimized = 'true';
    delById(openWindows, win);
    if (minimized.indexOf(win) === -1) minimized.push(win);
    renderTaskbar();
    syncNav();
    focusDesktopOrTop();
  }

  function restoreWindow(win) {
    win.dataset.minimized = 'false';
    delById(minimized, win);
    if (!win.classList.contains('open')) { win.classList.add('open'); openWindows.push(win); }
    focusWindow(win);
    win.focus();
    renderTaskbar();
    syncNav();
  }

  function toggleMaximize(win) {
    win.classList.toggle('maximized');
    focusWindow(win);
  }

  function delById(arr, win) { const i = arr.indexOf(win); if (i > -1) arr.splice(i, 1); }

  function closeTopWindow() {
    if (openWindows.length) closeWindow(openWindows[openWindows.length - 1]);
  }

  function closeAll() {
    openWindows.slice().forEach(closeWindow);
    minimized.slice().forEach(closeWindow);
    syncNav();
  }

  function focusDesktopOrTop() {
    if (openWindows.length) { const top = openWindows[openWindows.length - 1]; focusWindow(top); top.focus(); }
    else { document.getElementById('desktop').focus && document.getElementById('desktop').focus(); }
  }

  function renderTaskbar() {
    taskbar.innerHTML = '';
    minimized.forEach(function (win) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'task-btn';
      btn.textContent = windowTitle(win);
      btn.setAttribute('aria-label', 'Restore ' + windowTitle(win));
      btn.setAttribute('data-testid', 'task-' + win.id);
      btn.addEventListener('click', function () { restoreWindow(win); });
      taskbar.appendChild(btn);
    });
  }

  function syncNav() {
    let activeName = 'reset';
    if (openWindows.length) {
      const top = openWindows[openWindows.length - 1];
      if (top.id === 'win-about' || top.id === 'win-about-content') activeName = 'about';
      else if (top.id === 'win-contact') activeName = 'contact';
      else if (top.id === 'win-projects' || top.id === 'win-projects-content') activeName = 'projects';

      e.stopPropagation();
      const win = btn.closest('.window');
      if (btn.dataset.ctl === 'close') closeWindow(win);
      else if (btn.dataset.ctl === 'min') minimizeWindow(win);
      else if (btn.dataset.ctl === 'max') toggleMaximize(win);
    });
  });

  /* desktop icons + nav */
  document.querySelectorAll('[data-open]').forEach(function (el) {
    if (el.tagName === 'A') return;
    const target = el.dataset.open;
    el.addEventListener('click', function () {
      if (target === 'reset') { closeAll(); return; }
      const win = document.getElementById('win-' + target);
      openWindow(win);
      if (FOLDERS[target]) {
        const id = el.dataset.select || selected[target] || FOLDERS[target].defaultId;
        selectFolderItem(target, id);
      }
    });
  });

  document.querySelectorAll('.window').forEach(function (win) {
    win.addEventListener('mousedown', function () { if (win.classList.contains('open')) focusWindow(win); });
  });

  /* ─────────── FOLDER EXPLORER RENDERING ─────────── */
  const selected = {};       // folderKey -> selected item id
  const contentItem = {};    // folderKey -> id currently shown in its content popup

  function renderFolderGrid(key) {
    const cfg = FOLDERS[key];
    const grid = document.querySelector('.explorer-main[data-folder="' + key + '"]');
    grid.innerHTML = '';
    cfg.items.forEach(function (item) {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'fitem';
      el.setAttribute('role', 'option');
      el.dataset.id = item.id;
      el.setAttribute('data-testid', key + '-item-' + item.id);
      const glyph = item.img
        ? '<span class="fglyph photo"><img src="' + item.img + '" alt=""></span>'
        : '<span class="fglyph ' + (item.glyphClass || 'glyph-folder') + '">' + (item.glyph || item.emoji || '📄') + '</span>';
      el.innerHTML = glyph + '<span class="flabel">' + item.label + '</span>';
      el.addEventListener('click', function () { selectFolderItem(key, item.id); });
      el.addEventListener('dblclick', function () { openFolderContent(key, item.id); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFolderContent(key, item.id); }
      });
      grid.appendChild(el);
    });
  }

  function findItem(key, id) { return FOLDERS[key].items.find(function (i) { return i.id === id; }); }

  function selectFolderItem(key, id) {
    selected[key] = id;
    const grid = document.querySelector('.explorer-main[data-folder="' + key + '"]');
    grid.querySelectorAll('.fitem').forEach(function (el) {
      el.setAttribute('aria-selected', el.dataset.id === id ? 'true' : 'false');
    });
    renderPreview(key, id);
  }

  function renderPreview(key, id) {
    const item = findItem(key, id);
    const aside = document.querySelector('.explorer-aside[data-preview="' + key + '"]');
    const photo = item.img || item.previewImg;
    let media = '';
    if (photo) media = '<img class="preview-thumb" src="' + photo + '" alt="' + item.title + ' preview" data-lightbox-src="' + photo + '" />';
    else if (!item.previewRows) media = '<div class="preview-thumb ph" aria-hidden="true">' + (item.glyph || item.emoji || '📄') + '</div>';
    let body = '<h3>' + item.title + '</h3>';
    body += item.preview ? item.preview : '<p>' + item.desc + '</p>';
    if (item.previewRows) body += item.previewRows;
    if (item.stack) body += tags(item.stack);
    if (item.private) body += '<p class="proj-private">🔒 Private — available on request</p>';
    body += '<p class="preview-hint">Double-click to open in a window.</p>';
    aside.innerHTML = media + body;
    const thumb = aside.querySelector('[data-lightbox-src]');
    if (thumb) { thumb.style.cursor = 'zoom-in'; thumb.addEventListener('click', function () { openLightbox(thumb.getAttribute('data-lightbox-src')); }); }
  }

  function openFolderContent(key, id) {
    const cfg = FOLDERS[key];
    const item = findItem(key, id);
    const win = document.getElementById(cfg.contentWin);
    const titleEl = document.getElementById(cfg.titleEl);
    const body = $('.window-body', win);

    let html;
    if (key === 'projects') {
      let media = item.img
        ? '<img class="proj-thumb" style="border-radius:10px;margin-bottom:1rem;" src="' + item.img + '" alt="' + item.title + ' preview" data-lightbox-src="' + item.img + '" />'
        : '<div class="proj-thumb ph" style="border-radius:10px;margin-bottom:1rem;aspect-ratio:16/9;" aria-hidden="true">' + item.emoji + '</div>';
      html = '<h2>' + item.title + '</h2>' + media + '<p>' + item.desc + '</p>' + tags(item.stack) +
        (item.private ? '<p class="proj-private">🔒 Private — available on request</p>' : '');
    } else {
      html = item.content;
    }
    body.innerHTML = html;
    titleEl.textContent = (key === 'projects' ? '📁 ' : '🪪 ') + item.title;
    contentItem[key] = id;

    // wire lightbox on any thumb just injected
    body.querySelectorAll('[data-lightbox-src]').forEach(function (img) {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function () { openLightbox(img.getAttribute('data-lightbox-src')); });
    });

    openWindow(win); // single shared popup — reused, never duplicated
  }

  /* init folders */
  Object.keys(FOLDERS).forEach(function (key) {
    renderFolderGrid(key);
    selectFolderItem(key, FOLDERS[key].defaultId);
  });

  /* ─────────── KEYBOARD ─────────── */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (lightbox.classList.contains('open')) { closeLightbox(); return; }
      closeTopWindow();
    }
  });

  /* ─────────── DRAGGING ─────────── */
  document.querySelectorAll('.window-chrome').forEach(function (chrome) {
    let startX, startY, baseLeft, baseTop;
    const win = chrome.closest('.window');
    function onDown(e) {
      if (e.target.closest('[data-ctl]')) return;
      if (win.classList.contains('maximized')) return;
      focusWindow(win);
      const evt = e.touches ? e.touches[0] : e;
      const rect = win.getBoundingClientRect();
      win.style.left = rect.left + 'px';
      win.style.top = rect.top + 'px';
      win.style.transform = 'none';
      baseLeft = rect.left; baseTop = rect.top;
      startX = evt.clientX; startY = evt.clientY;
      chrome.classList.add('dragging');
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onUp);
    }
    function onMove(e) {
      const evt = e.touches ? e.touches[0] : e;
      if (e.cancelable && e.touches) e.preventDefault();
      const nx = baseLeft + (evt.clientX - startX);
      const ny = baseTop + (evt.clientY - startY);
      const maxX = window.innerWidth - 60;
      const maxY = window.innerHeight - 40;
      win.style.left = Math.min(Math.max(nx, -win.offsetWidth + 80), maxX) + 'px';
      win.style.top = Math.min(Math.max(ny, 8), maxY) + 'px';
    }
    function onUp() {
      chrome.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    chrome.addEventListener('mousedown', onDown);
    chrome.addEventListener('touchstart', onDown, { passive: true });
  });

  /* ─────────── LIGHTBOX ─────────── */
  const lightboxImg = document.getElementById('lightboxImg');
  function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add('open'); }
  function closeLightbox() { lightbox.classList.remove('open'); lightboxImg.src = ''; }
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox || e.target.closest('.lightbox-close')) closeLightbox();
  });
})();
</script>
</body>
</html>
